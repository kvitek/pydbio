[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "psqlacc"
version = "0.0.1"
authors = [
  { name="Victor Kugushev", email="vkugushev@gmail.com" },
]
description = "PSQL access package"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]